<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>LUNA Shift: E-Mail bestätigen</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #20202a; line-height: 1.5">
    <main style="max-width: 480px; margin: 32px auto; padding: 0 20px">
      <h1 style="font-size: 24px">Dein LUNA-Konto</h1>
      <p>Gib diesen Bestätigungscode in LUNA Shift ein:</p>
      <p style="font-size: 30px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
      <p>Du hast kein Konto angelegt? Dann kannst du diese E-Mail ignorieren.</p>
    </main>
  </body>
</html>
