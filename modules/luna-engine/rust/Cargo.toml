[package]
name = "luna-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
bigdecimal = "=0.4.10"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
jiff = { version = "=0.2.43", default-features = false, features = ["std"] }
source-tzdb = { package = "jiff-tzdb", version = "=0.1.7" }
jsonschema = { version = "=0.61.1", default-features = false }
url = "=2.5.8"
sha2 = "=0.10.9"
ryu-js = { version = "=1.0.3", default-features = false }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.130"

[build-dependencies]
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "unwind"

[workspace]
